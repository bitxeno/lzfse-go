name: Go

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.14.1

      - name: Build native libraries
        run: go run ./internal/libbuild -all

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Vet
        run: go vet ./...

      - name: Test without cgo
        run: go test -v -count=1 ./...
        env:
          CGO_ENABLED: "0"
