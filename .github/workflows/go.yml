name: Go

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Vet
        run: go vet ./...

      # The prebuilt libraries committed under libs/ are embedded via
      # go:embed, so tests run without building anything native.
      - name: Test without cgo
        run: go test -v -count=1 ./...
        env:
          CGO_ENABLED: "0"

  build-native:
    # Rebuild the embedded libraries with zig when the native sources or the
    # build tool change, and verify the result loads and passes the tests.
    if: >-
      github.event_name == 'pull_request' ||
      contains(github.event.head_commit.modified, 'native/') ||
      contains(github.event.head_commit.added, 'native/') ||
      contains(github.event.head_commit.removed, 'native/') ||
      contains(github.event.head_commit.modified, 'internal/libbuild/') ||
      contains(github.event.head_commit.added, 'internal/libbuild/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Build all native libraries
        run: go run ./internal/libbuild -all

      - name: Test against freshly built libraries
        run: go test -count=1 ./...
        env:
          CGO_ENABLED: "0"
